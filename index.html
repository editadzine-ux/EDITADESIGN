<style>
body{margin:0}
a{color:inherit}a:hover{color:#B91E34}
.ed{--bg:#F1EADC;--fg:#1E1E26;--muted:#5A5650;--line:rgba(30,30,38,.14);--card:#F7F2E8;--p:1;background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans Hebrew',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
.ed.dark{--bg:#17171D;--fg:#F1EADC;--muted:#B9B2A6;--line:rgba(241,234,220,.16);--card:#202028}
.ed *{box-sizing:border-box}
.syne{font-family:'Syne','IBM Plex Sans Hebrew',sans-serif}
.ltr{direction:ltr;text-align:right}
.wrap{width:100%;max-width:1440px;margin:0 auto;padding-inline:clamp(20px,4.4vw,64px)}
.ed h1,.ed h2,.ed h3,.ed blockquote,.mani-en,.flock-cap p{text-wrap:balance}
.ed p,.mani-he,.tile p{text-wrap:pretty}
.ed h1,.ed h2,.ed h3{font-feature-settings:'kern' 1}
.hero-wrap{display:flex;flex-direction:column}
.eyebrow{font-family:'Syne',sans-serif;font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
.chap{display:inline-flex;align-items:center;gap:14px;margin:0 0 26px}
.chap-n{font:700 13px/1 'Syne',sans-serif;letter-spacing:.16em;padding:8px 12px;border-radius:999px;border:1.5px solid currentColor;direction:ltr}
.chap-t{font-size:15px;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border-radius:999px;font:500 16px/1 'IBM Plex Sans Hebrew',sans-serif;text-decoration:none;cursor:pointer;border:1.5px solid var(--fg);transition:transform .4s cubic-bezier(.2,.8,.2,1),background .3s,color .3s,border-color .3s}
.btn:hover{transform:translateY(-3px)}
.btn-ink{background:#1E1E26;color:#F1EADC;border-color:#1E1E26}
.btn-ink:hover{color:#F1EADC;background:#B91E34;border-color:#B91E34}
.btn-mus{background:#E8A82A;color:#1E1E26;border-color:#E8A82A}
.btn-mus:hover{color:#1E1E26;background:#F1EADC;border-color:#F1EADC}
.btn-ghost{background:transparent;color:var(--fg)}
.btn-ghost:hover{background:var(--fg);color:var(--bg)}
.navlink{text-decoration:none;font-size:18px;font-weight:500;position:relative;padding:8px 0}
.navlink:after{content:'';position:absolute;inset-inline:0;bottom:0;height:2px;background:#D7263D;transform:scaleX(0);transform-origin:right;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.navlink:hover{color:inherit}.navlink:hover:after{transform:scaleX(1)}
.menu-btn{display:none}
.ibtn{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--fg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:border-color .3s,background .3s}
.ibtn:hover{border-color:var(--fg)}
.hero{position:relative;padding-top:clamp(36px,5vw,76px);padding-bottom:clamp(40px,5vw,72px);overflow:hidden}
.hshape{position:absolute;pointer-events:none;z-index:0}
.hs-sky{width:clamp(220px,30vw,460px);aspect-ratio:1;border-radius:50%;background:#9DBFD6;top:-8%;left:-7%;transform:translateY(calc(var(--p) * 140px))}
.hs-lens{width:clamp(520px,78vw,1240px);height:calc(clamp(520px,78vw,1240px) * .3);bottom:-10%;right:-14%;transform:rotate(-5deg)}
.hs-red{width:clamp(56px,7vw,110px);aspect-ratio:1;border-radius:50%;background:#D7263D;bottom:7%;left:5%;transform:translateY(calc(var(--p) * -200px))}
.stage{position:relative;z-index:1}
.stage-top{display:none}
.stage-time{font:700 12px/1 'Syne',sans-serif;letter-spacing:.12em;color:rgba(241,234,220,.7);direction:ltr}
.eye-frame{position:relative;border-radius:28px;overflow:hidden;background:#F1EADC;aspect-ratio:1920/700;animation:eyeOpen 1.6s cubic-bezier(.7,0,.15,1) .25s both;box-shadow:0 40px 80px -40px rgba(30,30,38,.45)}
@keyframes eyeOpen{0%{clip-path:ellipse(46% .4% at 50% 50%)}45%{clip-path:ellipse(48% 36% at 50% 50%)}100%{clip-path:ellipse(85% 95% at 50% 50%)}}
.eye-frame video{width:100%;height:100%;display:block;object-fit:cover;background:#F1EADC}
.bigplay{position:absolute;inset:0;margin:auto;width:118px;height:118px;border-radius:50%;border:0;background:#1E1E26;color:#F1EADC;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.bigplay:hover{transform:scale(1.07)}
.ctrl{position:relative;z-index:1;display:flex;align-items:center;gap:14px;margin-top:18px}
.sound{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:0 26px 0 22px;border-radius:999px;border:0;background:#D7263D;color:#F1EADC;font:600 16px/1 'IBM Plex Sans Hebrew',sans-serif;cursor:pointer;flex:none;transition:transform .3s,background .3s;animation:pulse 2.4s ease-in-out 3s 3}
.sound:hover{transform:translateY(-2px)}
.sound.on{background:#1E1E26;animation:none}
.ctrl .sound{width:50px;height:50px;min-height:0;padding:0;gap:0;border-radius:50%;background:#1E1E26;color:#F1EADC;animation:none}
.ctrl .sound:hover{background:#D7263D}
.ctrl .sound.on{background:#E8A82A;color:#1E1E26}
.ctrl .sound .hs-on,.ctrl .sound.on .hs-off{display:none}
.ctrl .sound.on .hs-on{display:block}
.ed.dark .ctrl .sound:not(.on){background:#F1EADC;color:#1E1E26}
.sig{display:block;height:58px;width:auto;overflow:visible}
.sig .sg-ink{fill:var(--fg)}
.sig{animation:sgFade 14s ease-in-out infinite}
.sig .sg-tri{fill:#D7263D;transform-box:fill-box;transform-origin:50% 100%;animation:sgTri 14s cubic-bezier(.3,1.5,.5,1) infinite}
.sig .sgw{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);animation:14s cubic-bezier(.55,.1,.35,1) infinite}
.sig .w1{animation-name:sgW1}.sig .w2{animation-name:sgW2}.sig .w3{animation-name:sgW3}
@keyframes sgW1{0%,2%{transform:scaleX(0)}10%,100%{transform:scaleX(1)}}
@keyframes sgW2{0%,9%{transform:scaleX(0)}23%,100%{transform:scaleX(1)}}
@keyframes sgW3{0%,22%{transform:scaleX(0)}29%,100%{transform:scaleX(1)}}
@keyframes sgTri{0%,29%{opacity:0;transform:translateY(-60px) rotate(-90deg) scale(.4)}36%,100%{opacity:1;transform:none}}
@keyframes sgFade{0%,79%{opacity:1}91%,100%{opacity:0}}
@media (min-width:981px){.sig{height:84px}}
@media (max-width:700px){.sig{height:48px}}
@media (prefers-reduced-motion:reduce){.sig,.sig .sgw,.sig .sg-tri{animation:none;transform:none;opacity:1}}
.hdr-snd{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 18px 0 14px;border-radius:999px;border:0;background:#D7263D;color:#F1EADC;font:600 15px/1 'IBM Plex Sans Hebrew',sans-serif;cursor:pointer;transition:background .3s,color .3s,transform .3s;animation:pulse 2.4s ease-in-out 1.5s infinite}
.hdr-snd:hover{transform:translateY(-2px)}
.hdr-snd .hs-ic{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;background:rgba(241,234,220,.16)}
.hdr-snd .hs-on,.hdr-snd .eq{display:none}
.hdr-snd.on{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line);animation:none}
.hdr-snd.on .hs-ic{background:#E8A82A;color:#1E1E26}
.hdr-snd.on .hs-off{display:none}.hdr-snd.on .hs-on{display:block}
.hdr-snd.on .eq{display:inline-flex}
.hdr-snd.on .eq i{animation:eq .9s ease-in-out infinite}
.hdr-snd.on .eq i:nth-child(2){animation-delay:.2s}.hdr-snd.on .eq i:nth-child(3){animation-delay:.45s}.hdr-snd.on .eq i:nth-child(4){animation-delay:.1s}
.hdr-snd.hero-snd{position:absolute;top:clamp(16px,1.8vw,28px);inset-inline-start:max(clamp(20px,4.4vw,64px),calc((100% - 1440px)/2 + clamp(20px,4.4vw,64px)));z-index:6;flex-direction:column;gap:5px;height:auto;padding:0;background:none;box-shadow:none;animation:none;color:#F1EADC;font:500 12px/1 'IBM Plex Sans Hebrew',sans-serif;letter-spacing:.04em;gap:7px}
.hdr-snd.hero-snd:hover{transform:none}
.hero-snd .hs-ic{width:48px;height:48px;background:rgba(30,30,38,.42);color:#F1EADC;box-shadow:inset 0 0 0 1px rgba(241,234,220,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .3s,transform .3s;animation:sndRing 2.8s ease-out 1.5s infinite}
.hero-snd .hs-ic svg{width:21px;height:21px}
.hero-snd:hover .hs-ic{background:#D7263D;transform:scale(1.06)}
.hero-snd .hs-lbl{opacity:.85;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.hero-snd .eq{display:none!important}
.hdr-snd.hero-snd.on{background:none;box-shadow:none;color:#F1EADC}
.hero-snd.on .hs-ic{background:rgba(232,168,42,.9);color:#1E1E26;box-shadow:none;animation:none}
@keyframes sndRing{0%{box-shadow:inset 0 0 0 1px rgba(241,234,220,.35),0 0 0 0 rgba(241,234,220,.35)}70%,100%{box-shadow:inset 0 0 0 1px rgba(241,234,220,.35),0 0 0 10px rgba(241,234,220,0)}}
@media (max-width:700px){.hero-snd{display:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(215,38,61,.45)}50%{box-shadow:0 0 0 14px rgba(215,38,61,0)}}
.eq{display:inline-flex;align-items:flex-end;gap:3px;height:16px}
.eq i{display:block;width:3px;height:30%;background:currentColor;border-radius:2px}
.sound.on .eq i{animation:eq .9s ease-in-out infinite}
.sound.on .eq i:nth-child(2){animation-delay:.2s}.sound.on .eq i:nth-child(3){animation-delay:.45s}.sound.on .eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.track{position:relative;flex:1;height:52px;display:flex;align-items:center}
.track-bg{position:absolute;inset-inline:0;height:4px;border-radius:4px;background:var(--line)}
.track-fill{position:absolute;inset-inline-start:0;height:4px;border-radius:4px;background:#E8A82A}
.track input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
.time{font:600 13px/1 'Syne',sans-serif;color:var(--muted);min-width:96px;text-align:center;direction:ltr}
.flock0{position:absolute;inset:0;pointer-events:none;z-index:2}
.bird{position:absolute;width:46px;height:19px;opacity:0;animation:fly 3.4s cubic-bezier(.3,.6,.3,1) both}
.c-mus{color:#E8A82A}.c-red{color:#D7263D}.c-sky{color:#9DBFD6}.c-ink{color:#1E1E26}.c-cream{color:#F1EADC}
@keyframes fly{0%{opacity:0;transform:translate(0,30px) scale(.5)}18%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-280px) scale(1.15) rotate(var(--r))}}
.bd1{top:6%;right:12%;--dx:-60px;--r:-8deg;animation-delay:1.4s}.bd2{top:2%;right:22%;--dx:40px;--r:6deg;animation-delay:1.55s;width:34px}.bd3{top:10%;right:34%;--dx:-30px;--r:-4deg;animation-delay:1.65s}.bd4{top:4%;right:46%;--dx:70px;--r:10deg;animation-delay:1.5s;width:30px}.bd5{top:8%;right:58%;--dx:-50px;--r:-10deg;animation-delay:1.7s}.bd6{top:1%;right:68%;--dx:30px;--r:5deg;animation-delay:1.6s;width:36px}.bd7{top:7%;right:78%;--dx:-70px;--r:-6deg;animation-delay:1.8s}.bd8{top:12%;right:88%;--dx:20px;--r:8deg;animation-delay:1.75s;width:28px}
.hl{background:linear-gradient(transparent 60%,rgba(232,168,42,.7) 60%,rgba(232,168,42,.7) 92%,transparent 92%)}
.marq{position:relative;z-index:2;background:#E8A82A;color:#1E1E26;padding:22px 0;direction:ltr;transform:rotate(-2deg);margin:-40px -2% 0;width:104%;overflow:hidden}
.marq-track{display:flex;width:max-content;animation:marq 46s linear infinite;align-items:center}
.marq-item{font:800 clamp(30px,4.4vw,64px)/1 'Syne',sans-serif;white-space:nowrap;padding:0 26px;letter-spacing:-.01em}
.marq-item.o{color:transparent;-webkit-text-stroke:1.5px #1E1E26}
.marq-bird{width:38px;height:16px;flex:none}
@keyframes marq{to{transform:translateX(-50%)}}
.rv{opacity:0;transform:translateY(34px);transition:opacity 1s cubic-bezier(.2,.8,.2,1),transform 1s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.12s}.rv.d2{transition-delay:.24s}.rv.d3{transition-delay:.36s}
.spark{position:relative;color:#F1EADC;padding-top:300px;margin-top:-30px}
.spark-bg{position:absolute;inset:0;background:#1E1E26;clip-path:circle(calc(max(0, var(--p) - .22) * 270%) at 50% 150px);z-index:0}
.match{position:absolute;top:150px;left:50%;width:14px;height:190px;margin-left:-7px;z-index:1}
.match-stick{position:absolute;top:22px;left:4px;width:6px;height:170px;border-radius:3px;background:#1E1E26}
.match-head{position:absolute;top:0;left:-1px;width:16px;height:30px;background:#D7263D;clip-path:polygon(50% 0,100% 100%,0 100%)}
.flame{position:absolute;bottom:170px;left:50%;width:70px;height:96px;margin-left:-35px;transform-origin:50% 100%;transform:scale(clamp(0, calc(var(--p) * 5), 1))}
.flame-o{animation:flick 1.3s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes flick{from{transform:scaleY(1) rotate(-2deg)}to{transform:scaleY(1.08) rotate(2deg)}}
.spark-in{position:relative;z-index:2;opacity:clamp(0, calc((var(--p) - .45) * 3), 1)}
.mani{display:grid;grid-template-columns:64px minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,3vw,56px);align-items:baseline;padding:38px 0;border-top:1px solid rgba(241,234,220,.16)}
.mani-n{font:700 14px/1 'Syne',sans-serif;color:#D7263D;letter-spacing:.1em;direction:ltr}
.mani-en{font:700 clamp(20px,2.3vw,36px)/1.15 'Syne',sans-serif;letter-spacing:-.02em;direction:ltr;text-align:left;color:rgba(241,234,220,.62)}
.mani-en em{font-style:normal;color:#F1EADC}
.mani-he em{font-style:normal;color:#E8A82A}
.mani-he{font-size:clamp(26px,3vw,46px);line-height:1.2;font-weight:600;color:#F1EADC;letter-spacing:-.005em}
.flock-wrap{padding-bottom:clamp(70px,8vw,130px)}
.flockx{position:relative;width:100%;max-width:1100px;margin:0 auto;aspect-ratio:1000/420}
.fk{position:absolute;width:44px;height:18px;margin:-9px 0 0 -22px;will-change:transform}
.pupil{position:absolute;left:50%;top:50%;width:21%;aspect-ratio:1;border-radius:50%;background:#D7263D;transform:translate(-50%,-50%) scale(clamp(0, calc((var(--p) - .82) * 6), 1));transition:transform .2s}
.pupil:after{content:'';position:absolute;inset:34%;background:#E8A82A;clip-path:polygon(0 0,100% 50%,0 100%);transform:translateX(12%)}
.flock-cap{text-align:center;opacity:clamp(0, calc((var(--p) - .7) * 4), 1)}
.services{position:relative;z-index:3;background:var(--bg);border-radius:50% 50% 0 0 / 110px 110px 0 0;margin-top:-1px;padding-top:150px}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tile{position:relative;border-radius:26px;padding:32px;min-height:270px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.tile:hover{transform:translateY(-6px) rotate(-.4deg)}
.tile h3{margin:0 0 10px;font-size:clamp(22px,2.1vw,30px);font-weight:600;line-height:1.15}
.tile p{margin:0;font-size:16px;line-height:1.6;max-width:36ch}
.tile .tag{position:absolute;top:28px;inset-inline-start:32px;font:600 12px/1 'Syne',sans-serif;letter-spacing:.2em;text-transform:uppercase}
.t-brand{grid-column:span 2;grid-row:span 2;background:#E8A82A;color:#1E1E26;min-height:560px}
.t-ux{grid-column:span 2;background:#1E1E26;color:#F1EADC}
.t-wp{background:#9DBFD6;color:#1E1E26}
.t-ai{background:#F7F2E8;color:#1E1E26;border:1.5px solid #1E1E26}
.t-lp{grid-column:span 2;background:#B91E34;color:#F1EADC}
.t-res{grid-column:span 2;background:#1E1E26;color:#F1EADC}
.ill{position:absolute;pointer-events:none;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.t-brand .ill{top:76px;inset-inline-end:-24px;width:80%}
.tile:hover .ill{transform:translateY(-10px) rotate(-4deg) scale(1.04)}
.t-brand:hover .lid{animation:blink .5s ease}
@keyframes blink{0%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}
.lid{transform-origin:100px 60px;transform-box:view-box}
.work{position:relative;z-index:4;background:#1E1E26;color:#F1EADC;padding-bottom:clamp(220px,18vw,320px)}
.pen{display:block;width:100%;height:auto;overflow:visible}
.pen-path{stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--p))}
.acc{display:flex;gap:10px;height:clamp(520px,44vw,680px);direction:rtl}
.acc-p{position:relative;flex:1 1 0;min-width:0;border-radius:22px;overflow:hidden;background:#2A2A33;transition:flex-grow .85s cubic-bezier(.7,0,.2,1)}
.acc-p.on{flex-grow:9}
.acc-p img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.45) brightness(.6);transform:scale(1.08);transition:filter .8s,transform 1.4s cubic-bezier(.2,.8,.2,1)}
.acc-p.on img{filter:none;transform:none}
.acc-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,23,29,0) 40%,rgba(23,23,29,.85) 100%);opacity:0;transition:opacity .6s}
.acc-p.on .acc-shade{opacity:1}
.acc-tab{position:absolute;inset:0;border:0;background:transparent;color:#F1EADC;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:22px 0;transition:opacity .4s}
.acc-p.on .acc-tab{opacity:0;pointer-events:none}
.acc-tno{font:800 13px/1 'Syne',sans-serif;letter-spacing:.1em;direction:ltr}
.acc-vname{writing-mode:vertical-rl;transform:rotate(180deg);font:800 clamp(18px,1.6vw,24px)/1 'Syne',sans-serif;letter-spacing:.02em;white-space:nowrap;direction:ltr}
.acc-info{position:absolute;inset-inline:0;bottom:0;padding:clamp(24px,3vw,44px);color:#F1EADC;opacity:0;transform:translateY(24px);transition:opacity .5s,transform .7s cubic-bezier(.2,.8,.2,1);pointer-events:none;min-width:420px}
.acc-p.on .acc-info{opacity:1;transform:none;transition-delay:.4s;pointer-events:auto}
.acc-no{font:800 14px/1 'Syne',sans-serif;letter-spacing:.12em;direction:ltr;display:inline-block}
.acc-name{margin:10px 0 6px;font:800 clamp(40px,5vw,84px)/.9 'Syne',sans-serif;letter-spacing:-.04em;direction:ltr;text-align:right}
.acc-client{margin:0 0 16px;font-size:17px;color:rgba(241,234,220,.82)}
.acc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.acc-cta{display:flex;gap:10px;flex-wrap:wrap}
.acc-live{color:#F1EADC;border-color:rgba(241,234,220,.5)}
.acc-live:hover{background:#F1EADC;color:#1E1E26}
.acc-prog{position:absolute;top:0;inset-inline:0;height:3px;background:rgba(241,234,220,.15);opacity:0}
.acc-p.on .acc-prog{opacity:1}
.acc-prog i{display:block;height:100%;width:0;background:#E8A82A}
.acc-p.on .acc-prog i{animation:accprog 5.5s linear forwards}
.acc:hover .acc-prog i{animation-play-state:paused}
@keyframes accprog{to{width:100%}}
.acc-ctrl{display:flex;align-items:center;gap:12px;margin-top:22px;color:#F1EADC}
